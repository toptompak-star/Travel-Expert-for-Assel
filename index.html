<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Expert</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* атрибут hidden всегда скрывает элемент, даже если у класса задан display */
[hidden]{display:none!important}
:root{
  --bg:#F3EFE7; --surface:#FFFFFF; --surface-2:#EDE7DC; --surface-3:#F8F5EF; --line:#E2DACC; --line-2:#D5CBB9;
  --ink:#0B1F3A; --ink-2:#44536A; --ink-3:#7A8698;
  --accent:#0E7C78; --accent-soft:#D5ECEA; --accent-ink:#FFFFFF;
  --gold:#9C7424; --gold-soft:#F2E6CA;
  --ok:#23734A; --ok-soft:#DDEFE4; --warn:#9A6A10; --warn-soft:#F6EACB; --risk:#B4531F; --risk-soft:#F7E0D2; --bad:#B42331; --bad-soft:#F6DADC; --na:#6B7485; --na-soft:#E7E9ED;
  --demo:#7B55B5; --demo-soft:#ECE4F7;
  --shadow:0 1px 2px rgba(11,31,58,.05),0 10px 30px rgba(11,31,58,.07);
  --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut:clamp(16px,2vw,28px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#08111D; --surface:#0E1A2B; --surface-2:#15253B; --surface-3:#0B1624; --line:#1E3350; --line-2:#29425F;
  --ink:#E9EFF6; --ink-2:#A8B6C8; --ink-3:#74849A; --accent:#43C2BA; --accent-soft:#0F3A3B; --accent-ink:#04201F;
  --gold:#E0B460; --gold-soft:#372B12; --ok:#5FCB8C; --ok-soft:#13311F; --warn:#E6B94F; --warn-soft:#3A2D10; --risk:#F0925F; --risk-soft:#3B2014; --bad:#F07480; --bad-soft:#3D1519; --na:#9AA5B6; --na-soft:#1E2A3B;
  --demo:#BFA0EC; --demo-soft:#2A1F40; --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#08111D; --surface:#0E1A2B; --surface-2:#15253B; --surface-3:#0B1624; --line:#1E3350; --line-2:#29425F;
  --ink:#E9EFF6; --ink-2:#A8B6C8; --ink-3:#74849A; --accent:#43C2BA; --accent-soft:#0F3A3B; --accent-ink:#04201F;
  --gold:#E0B460; --gold-soft:#372B12; --ok:#5FCB8C; --ok-soft:#13311F; --warn:#E6B94F; --warn-soft:#3A2D10; --risk:#F0925F; --risk-soft:#3B2014; --bad:#F07480; --bad-soft:#3D1519; --na:#9AA5B6; --na-soft:#1E2A3B;
  --demo:#BFA0EC; --demo-soft:#2A1F40; --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:var(--gut);padding-block:0 40px;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:.02em}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:12.5px}.xs{font-size:11.5px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
/* status badges */
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:2px 7px;white-space:nowrap;vertical-align:middle}
.st-real{background:var(--ok-soft);color:var(--ok)}.st-snap{background:var(--accent-soft);color:var(--accent)}.st-demo{background:var(--demo-soft);color:var(--demo)}.st-est{background:var(--warn-soft);color:var(--warn)}.st-none{background:var(--na-soft);color:var(--na)}
.sf{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.sf-green{background:var(--ok-soft);color:var(--ok)}.sf-yellow{background:var(--warn-soft);color:var(--warn)}.sf-orange{background:var(--risk-soft);color:var(--risk)}.sf-red{background:var(--bad-soft);color:var(--bad)}.sf-unknown{background:var(--na-soft);color:var(--na)}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:calc(-1*var(--gut));padding:10px var(--gut);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:32px;height:32px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--display);font-size:23px;font-weight:600}
.tnav{display:flex;gap:2px;margin-left:8px}
.tnav button{border:0;background:none;padding:7px 12px;border-radius:999px;color:var(--ink-2);font-weight:500}
.tnav button:hover{background:var(--surface-2);color:var(--ink)}
.tnav .cnt{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px;margin-left:4px}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.selm{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
/* ask bar */
.ask{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding-block:18px 14px}
.ask h1{font-family:var(--display);font-size:clamp(26px,2.6vw,38px);font-weight:600;white-space:nowrap}
.ask h1 em{color:var(--accent);font-style:italic;font-weight:500}
.askbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
.askbox input{flex:1;border:0;background:transparent;padding:10px 0;font-size:15px;min-width:0}
.askbox input:focus{outline:none}
.askmeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
@media (max-width:1100px){.ask{grid-template-columns:1fr}.ask h1{white-space:normal}.askmeta{justify-content:flex-start;max-width:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-pri:hover{background:color-mix(in srgb,var(--ink) 85%,var(--accent))}
.btn-acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-bk{background:#003B95;border-color:#003B95;color:#fff}
.btn-bk:hover{background:#0050C8}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
/* layout */
.app{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(420px,34%);gap:18px;align-items:start}
@media (min-width:1900px){.app{grid-template-columns:320px minmax(0,1fr) minmax(520px,36%)}}
@media (max-width:1280px){.app{grid-template-columns:280px minmax(0,1fr)}.details{grid-column:1/-1}}
@media (max-width:900px){.app{grid-template-columns:1fr}.params{display:none}.params.open{display:block;position:fixed;inset:0;z-index:60;overflow:auto;padding:16px;background:var(--bg)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.params{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;padding:4px 0 10px}
.pgroup{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.pgroup:last-child{border-bottom:0}
.pgroup>.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{width:100%;background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctr .cc{display:flex;align-items:center;gap:8px}
.ctr b{min-width:18px;text-align:center}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sw{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.sw input{accent-color:var(--accent)}
.rng{display:flex;align-items:center;gap:8px;font-size:12.5px}
.rng input{flex:1;accent-color:var(--accent)}
.rng b{min-width:44px;text-align:right}
/* calendar mini */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:12px}
.cal .dw{color:var(--ink-3);text-align:center;font-size:10.5px;padding:2px 0}
.cal button{border:0;background:none;border-radius:7px;aspect-ratio:1;font-variant-numeric:tabular-nums;font-size:12px}
.cal button:hover:not(:disabled){background:var(--surface-2)}
.cal button:disabled{opacity:.35}
.cal .in{background:var(--accent-soft);border-radius:0}
.cal .s,.cal .e{background:var(--accent);color:var(--accent-ink);font-weight:700}
.calh{display:flex;align-items:center;justify-content:space-between}
.calh b{text-transform:capitalize;font-size:13px}
/* results */
.rhead{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:baseline;gap:8px}
.kpi b{font-family:var(--display);font-size:26px;line-height:1}
.kpi span{font-size:12px;color:var(--ink-2)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.whynot{display:flex;gap:6px;margin-left:auto;min-width:260px;flex:1;max-width:420px}
.whynot input{flex:1}
.list{display:flex;flex-direction:column;gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:128px minmax(0,1fr);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.res:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.res.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.res.gated{opacity:.9}
.rimg{position:relative;min-height:100%;background:var(--surface-2)}
.rimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rimg .flag{position:absolute;left:10px;top:10px;font-size:30px;line-height:1}
.rimg .rk{position:absolute;left:10px;bottom:10px;font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink-3)}
.rimg.has .rk{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rbody{padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.rtop{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rtop h3{font-family:var(--display);font-size:24px;font-weight:600}
.rtop .cn{color:var(--ink-3);font-size:12.5px}
.match{margin-left:auto;display:flex;align-items:baseline;gap:4px}
.match b{font-size:22px;font-variant-numeric:tabular-nums}
.match span{font-size:12px;color:var(--ink-2)}
.factors{display:flex;gap:4px;flex-wrap:wrap}
.fc{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;border-radius:8px;padding:2px 7px;background:var(--surface-3);color:var(--ink-2)}
.fc i{width:7px;height:7px;border-radius:50%;display:inline-block}
.q-hi{background:var(--ok)}.q-mid{background:var(--warn)}.q-lo{background:var(--risk)}.q-na{background:var(--na)}
.rline{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13px}
.rline .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:right}
.rline .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.rfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:8px}
.rtotal{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.rfoot .pp{color:var(--ink-2);font-size:12.5px}
.rfoot .act{margin-left:auto;display:flex;gap:6px}
.why1{font-size:12.5px;color:var(--ink-2)}
@media (max-width:600px){.res{grid-template-columns:1fr}.rimg{min-height:110px}.rimg:not(.has){display:none}.mflag{display:inline!important}}
.mflag{display:none}
.more{display:flex;justify-content:center;gap:12px;align-items:center;margin-top:14px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sechead h3{font-family:var(--display);font-size:24px;font-weight:600}
.reasons{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card.warnc{border-color:var(--risk)}
/* map */
.mapwrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mapwrap canvas{display:block;width:100%;height:auto;cursor:crosshair}
.maptip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:8px;padding:5px 8px;white-space:nowrap}
.maplegend{position:absolute;left:12px;bottom:10px;display:flex;gap:10px;font-size:11.5px;color:var(--ink-2);background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:8px;padding:4px 8px}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* details */
.details{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
.dhero{position:relative;aspect-ratio:16/8;max-width:100%;background:var(--surface-2);border-radius:18px 18px 0 0;overflow:hidden}
.dhero img{width:100%;height:100%;object-fit:cover;display:block}
.dhero .ov{position:absolute;inset:auto 0 0 0;padding:16px 18px;background:linear-gradient(0deg,rgba(6,14,26,.8),rgba(6,14,26,0));color:#fff}
.dhero .ov h2{font-family:var(--display);font-size:36px;font-weight:600;color:#fff}
.dhero .ov p{font-size:13px;color:rgba(255,255,255,.85)}
.dhero.nop{aspect-ratio:auto;padding:22px 18px 16px;display:flex;gap:14px;align-items:flex-end}
.dhero.nop .bigflag{font-size:54px;line-height:1}
.dhero.nop h2{font-family:var(--display);font-size:36px;font-weight:600}
.dhero .credit{position:absolute;right:10px;top:10px;font-size:11px;background:rgba(6,14,26,.6);color:#fff;border-radius:999px;padding:2px 8px;text-decoration:none}
.dhero .ph-fail{position:absolute;inset:0;display:none;padding:16px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface-3) 10px 20px);font-size:12.5px;color:var(--ink-2)}
.dhero.failed img{display:none}.dhero.failed .ph-fail{display:block}.dhero.failed .ov{background:none;color:var(--ink)}.dhero.failed .ov h2,.dhero.failed .ov p{color:var(--ink)}
.dtabs{display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;background:var(--surface);z-index:2}
.dtabs button{border:0;background:none;border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.dtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.dbody{padding:16px 18px 20px;display:flex;flex-direction:column;gap:16px}
.dsum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bars{display:flex;flex-direction:column;gap:5px}
.bar-row{display:grid;grid-template-columns:150px 1fr 38px;gap:8px;align-items:center;font-size:12.5px}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar-row span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.why,.care{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.why li::before{content:"✓";color:var(--ok);font-weight:800;margin-right:8px}
.care li::before{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--risk-soft);color:var(--risk);font-weight:800;font-size:10px;margin-right:8px;vertical-align:1px}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.months div{border-radius:6px;padding:5px 0 4px;text-align:center;font-size:10.5px;color:var(--ink-2)}
.months div b{display:block;font-size:12px;color:var(--ink)}
.months .cur{outline:2px solid var(--ink);outline-offset:-2px}
.m-H{background:var(--ok-soft)}.m-S{background:var(--accent-soft)}.m-L{background:var(--warn-soft)}.m-O{background:var(--na-soft)}
.aps{display:flex;flex-direction:column;gap:6px}
.ap{display:grid;grid-template-columns:52px 1fr auto;gap:8px;font-size:12.5px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px}
.ap .code{font-family:var(--mono);font-weight:600}
.route{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.route.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chain{display:flex;flex-wrap:wrap;gap:5px;align-items:baseline;font-weight:600}
.chain small{font-family:var(--mono);color:var(--ink-3);font-weight:500}
.chain .ar{color:var(--ink-3);font-weight:400}
.legs{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.rt-foot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rt-foot b{font-size:18px;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--risk-soft);color:var(--risk)}.tag.acc{background:var(--accent-soft);color:var(--accent)}.tag.gold{background:var(--gold-soft);color:var(--gold)}
.selfwarn{font-size:12px;background:var(--risk-soft);border-radius:10px;padding:7px 9px}
.hgrid{display:grid;grid-template-columns:1fr;gap:10px}
.hcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:110px 1fr}
.hcard .hi{background:var(--surface-2);position:relative;min-height:120px}
.hcard .hi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hcard .hi .tier{position:absolute;left:8px;top:8px}
.hcard .hb{padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.hcard h4{font-size:14.5px}
.t-budget{background:var(--accent-soft);color:var(--accent)}.t-standard{background:var(--surface);color:var(--ink)}.t-premium{background:var(--gold-soft);color:var(--gold)}
.tier{font-size:10px;font-weight:800;letter-spacing:.12em;border-radius:999px;padding:3px 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:500}
.ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ln small{display:block;color:var(--ink-3);font-size:11.5px}
.ln span:last-child{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:6px}
.tot b{font-size:26px;font-variant-numeric:tabular-nums}
.info{border-radius:12px;padding:10px 12px;background:var(--surface-3);border:1px solid var(--line);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.info.w{background:var(--risk-soft);border-color:transparent}
.info.r{background:var(--bad-soft);border-color:transparent}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
/* tray & modal */
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.tray .tc{display:flex;gap:6px;overflow-x:auto}
.tray .tc span{background:color-mix(in srgb,var(--bg) 16%,transparent);border-radius:999px;padding:3px 9px;font-size:12px;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:70;background:rgba(4,10,20,.6);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.mcard{background:var(--surface);border-radius:20px;width:min(1200px,100%);max-height:100%;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mhead h3{font-family:var(--display);font-size:28px;font-weight:600}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-3)}
tr:last-child td{border-bottom:0}
td.best{color:var(--ok);font-weight:700}
/* chat */
.fab{position:fixed;right:var(--gut);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:80;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-head h3{font-family:var(--display);font-size:22px;font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13.5px}
.msg.bot{background:var(--surface-3);border:1px solid var(--line);align-self:flex-start}
.msg.user{background:var(--ink);color:var(--bg);align-self:flex-end;white-space:pre-wrap}
.composer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--surface-3);min-height:42px}
.mobbar{display:none}
@media (max-width:700px){.whynot{min-width:0;max-width:none;flex-basis:100%}.kpi b{font-size:22px}.rline{grid-template-columns:22px minmax(0,1fr)}.rline .v{grid-column:2;text-align:left}.bar-row{grid-template-columns:110px 1fr 36px}.ask h1{font-size:26px}}
@media (max-width:900px){.mobbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.details{position:fixed;inset:0;z-index:55;max-height:none;border-radius:0}.details.hidden-m{display:none}.dclose{display:grid!important}.tnav{display:none}}
.dclose{display:none;position:absolute;right:12px;top:12px;z-index:3;background:var(--surface)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* v5: страна/город, режимы поездки, туры */
.ccap{display:block;font-size:10.5px;letter-spacing:.14em;font-weight:800;color:var(--ink-3);text-transform:uppercase;line-height:1.3}
.ccap.lt{color:rgba(255,255,255,.85)}
.dhero.failed .ccap.lt{color:var(--ink-3)}
.rname{display:flex;flex-direction:column;min-width:0}
.res.pin{border-color:var(--accent)}
.opt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;background:var(--surface-3)}
.opt .ol{font-size:10.5px;letter-spacing:.1em;font-weight:800;color:var(--ink-2);text-transform:uppercase;min-width:132px}
.opt .t{flex:1 1 220px;min-width:0;color:var(--ink-2)}
.opt .t b{color:var(--ink);font-variant-numeric:tabular-nums}
.opt .btn{margin-left:auto}
.opt-tour{background:var(--surface-2)}
.chead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:12px}
.chead .cflag{font-size:40px;line-height:1}
.chead h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.ckpi{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.ckpi b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.chead .btn{margin-left:auto}
.picker{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:600;color:var(--ink)}
.picker[aria-expanded="true"]{border-color:var(--accent)}
.pop{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.plist{max-height:300px;overflow-y:auto;display:flex;flex-direction:column}
#cityList{max-height:none}
.plet{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:800;margin:8px 4px 4px}
.pitem{display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;border:0;background:none;border-radius:8px;padding:6px 8px;font-size:13px;color:var(--ink)}
.pitem:hover,.pitem:focus-visible{background:var(--surface-2)}
.pitem small{color:var(--ink-3);font-size:11.5px}
.dsel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dsel select{flex:1;min-width:130px}
.dchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 6px 5px 11px;font-weight:700;font-size:13px}
.dchip button{border:0;background:color-mix(in srgb,var(--accent) 18%,transparent);color:inherit;border-radius:999px;width:22px;height:22px;font-weight:800;line-height:1}
.srcsec{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-3)}
.tprice{margin-left:auto;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
table.ctab{min-width:520px}
.ctab small.cs{display:block;color:var(--ink-3);font-size:11px;margin-top:2px;font-weight:400}
.ctab tr.total td{background:var(--surface-3);font-weight:700}
@media (max-width:600px){.opt .ol{min-width:0;flex-basis:100%}.chead .btn{margin-left:0}table.ctab{min-width:0}.ctab td,.ctab th{padding:7px 6px}}
/* статус загрузки и ошибки */
.busy{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:90;display:flex;gap:8px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.errbar{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);background:var(--bad-soft);color:var(--ink);border:1px solid var(--bad);border-radius:14px;padding:9px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.errbar button{border:0;background:none;font-weight:800;color:var(--ink-2)}
.modfail{border:1px dashed var(--line-2);border-radius:12px;padding:12px;font-size:13px;color:var(--ink-2);background:var(--surface-3)}
.errbar.ok{background:var(--ok-soft);border-color:var(--ok)}
.srcname{font-weight:800;font-size:12.5px}
.mform{display:flex;flex-direction:column;gap:12px}
.mform fieldset{border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mform legend{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:800;padding:0 6px}
.mform label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.mform label.wide{grid-column:1/-1}
.mform textarea{resize:vertical}
.st-snap{white-space:nowrap}
details summary{cursor:pointer;padding:4px 0}
/* =====================================================================
   v6 · «Modern Nature»: 90% нейтральная база, зелёный — акцент и навигация, шафран — только главное действие
   ===================================================================== */
:root{
  --bg:#F8F8F5; --surface:#FFFFFF; --surface-2:#F0F1EC; --surface-3:#F8F8F5; --line:#E7E8E3; --line-2:#D5D8D1;
  --ink:#1E2420; --ink-2:#666D67; --ink-3:#737A74;
  --accent:#2F6B4F; --accent-soft:#EAF1EC; --accent-ink:#FFFFFF;
  --cta:#E2A93B; --cta-ink:#1E2420;
  --gold:#7C5A1A; --gold-soft:#F3EAD3;
  --ok:#2F7D4F; --ok-soft:#E6F1E9; --warn:#8F5E0E; --warn-soft:#F6ECD6; --risk:#A84F26; --risk-soft:#F7E8DF; --bad:#B03A27; --bad-soft:#F8E4DF; --na:#6F766F; --na-soft:#EEF0EC;
  --demo:#666D67; --demo-soft:#F0F1EC;
  --shadow:0 1px 2px rgba(30,36,32,.04),0 10px 28px rgba(30,36,32,.06);
  --display:"Lora",Georgia,"Times New Roman",serif;
  --gut:clamp(16px,3.2vw,56px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#141815; --surface:#1C211D; --surface-2:#252B26; --surface-3:#181D19; --line:#2C332E; --line-2:#3B443D;
  --ink:#ECEFEA; --ink-2:#A9B1AB; --ink-3:#98A19A; --accent:#84C6A0; --accent-soft:#1E2F26; --accent-ink:#0E1A13;
  --cta:#E2A93B; --cta-ink:#1E2420; --gold:#E0B460; --gold-soft:#372B12;
  --ok:#74CB93; --ok-soft:#16301F; --warn:#E6B94F; --warn-soft:#3A2D10; --risk:#F0925F; --risk-soft:#3B2014; --bad:#F2857A; --bad-soft:#3D1815; --na:#A1A9A3; --na-soft:#232924;
  --demo:#A9B1AB; --demo-soft:#252B26; --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#141815; --surface:#1C211D; --surface-2:#252B26; --surface-3:#181D19; --line:#2C332E; --line-2:#3B443D;
  --ink:#ECEFEA; --ink-2:#A9B1AB; --ink-3:#98A19A; --accent:#84C6A0; --accent-soft:#1E2F26; --accent-ink:#0E1A13;
  --cta:#E2A93B; --cta-ink:#1E2420; --gold:#E0B460; --gold-soft:#372B12;
  --ok:#74CB93; --ok-soft:#16301F; --warn:#E6B94F; --warn-soft:#3A2D10; --risk:#F0925F; --risk-soft:#3B2014; --bad:#F2857A; --bad-soft:#3D1815; --na:#A1A9A3; --na-soft:#232924;
  --demo:#A9B1AB; --demo-soft:#252B26; --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.35)}
body{font-size:15px;line-height:1.5;padding-block:0 96px}
a{color:var(--accent)}
/* спокойные базовые элементы */
.st{background:none!important;color:var(--ink-3)!important;padding:0;font-weight:600;font-size:10.5px;letter-spacing:.08em}
.tag{background:var(--surface-2);color:var(--ink-2);font-weight:500}
.tag.acc,.tag.gold,.tag.ok{background:var(--surface-2);color:var(--ink)}
.tag.warn{background:var(--risk-soft);color:var(--risk)}
.btn{border-radius:12px;border:1px solid var(--line-2);padding:9px 16px;font-size:14px}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn-pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-pri:hover{background:var(--ink);opacity:.9}
.btn-acc,.btn-bk{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.btn-acc:hover,.btn-bk:hover{background:var(--surface-2)}
.cta{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:var(--cta);color:var(--cta-ink);font-weight:700;font-size:16px;padding:0 30px;min-height:52px;white-space:nowrap;text-decoration:none}
.cta:hover{filter:brightness(.96)}
.cta.sm{min-height:46px;border-radius:12px;font-size:15px;padding:0 14px}
.outl{display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:12px;background:none;color:var(--ink);font-weight:700;font-size:15px;min-height:46px;padding:0 14px;white-space:nowrap}
.outl:hover{background:var(--surface-2)}
.linkbtn{font-size:14px;text-decoration:none}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:15px;text-align:left}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.quiet{border:0;background:none;padding:0;color:var(--ink-2);font-size:14px}
.quiet:hover{color:var(--ink)}
.chip{border-radius:10px;padding:7px 12px;font-size:14px;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{background:var(--surface);border-radius:10px;padding:9px 11px;font-size:14px}
.info{background:var(--surface-2);border:0;border-radius:12px;padding:12px 14px;font-size:13.5px}
.info.w{background:var(--risk-soft)}.info.r{background:var(--bad-soft)}
.card{border-radius:16px;border-color:var(--line)}
.sub{letter-spacing:.12em;font-size:11.5px;color:var(--ink-3)}
.cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.seg{background:var(--surface-2);border-radius:10px}.seg button{border-radius:8px;font-size:13px}
.icon-btn{border-color:var(--line)}
.sf{font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.sf-orange{background:var(--risk-soft);color:var(--risk)}.sf-red{background:var(--bad-soft);color:var(--bad)}.sf-green{background:var(--ok-soft);color:var(--ok)}.sf-unknown,.sf-yellow{background:var(--surface-2);color:var(--ink-2)}
.cal .s,.cal .e{background:var(--ink);color:var(--bg)}.cal .in{background:var(--surface-2)}
.sw input,.rng input{accent-color:var(--accent)}
.bar i{background:var(--ink-2)}
.m-H{background:var(--accent-soft)}.m-S{background:var(--surface-2)}.m-L{background:var(--warn-soft)}.m-O{background:var(--na-soft)}
.why li::before{color:var(--accent)}
.fab{background:var(--ink);color:var(--bg);font-weight:600;padding:12px 20px}
.tray{background:var(--ink);color:var(--bg)}
.tray .btn-acc{background:var(--cta);border-color:var(--cta);color:var(--cta-ink)}
.msg.user{background:var(--ink);color:var(--bg)}
td.best{color:var(--accent)}
.kpi b,.sechead h3,.mhead h3,.dr-head h3{font-weight:500}
.sechead{margin:44px 0 16px}.sechead h3{font-size:26px}
/* шапка */
.top{position:static;border-bottom:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:16px var(--gut);gap:10px 34px}
.brand b{font-size:23px;font-weight:600}
.tnav{gap:4px 30px;margin-left:0;flex-wrap:wrap}
.tnav button{padding:6px 0;border-radius:0;font-weight:400;font-size:15px;color:var(--ink-2);border-bottom:1.5px solid transparent}
.tnav button:hover{background:none;color:var(--ink)}
.tnav button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tnav .cnt{background:var(--ink);color:var(--bg)}
.selm{border-radius:10px;border-color:var(--line);font-size:14px}
.tools .quiet{min-height:36px;padding:0 6px}
/* заголовок и строка пожеланий */
.hero{display:flex;align-items:center;gap:14px 44px;flex-wrap:wrap;padding:16px 0 18px}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,2.6vw,40px);line-height:1.1}
.hero .askbox{flex:1 1 420px;min-width:0;max-width:100%;display:flex;gap:12px;background:none;border:0;box-shadow:none;padding:0;border-radius:0}
.hero .askbox input{flex:1;min-width:0;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 20px;font-size:16px}
.hero .askbox input:focus{outline:2px solid var(--accent);outline-offset:1px}
/* строка параметров */
.pbar{position:relative;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:stretch}
.fields{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fld{border:0;border-left:1px solid var(--line);background:none;padding:9px 22px 10px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:54px;flex:1 1 auto}
.fld:first-child{border-left:0}
.fld small{font-size:12.5px;color:var(--ink-2)}.fld b{font-size:15.5px;font-weight:700}
.fld:hover,.fld[aria-expanded="true"]{background:var(--surface-2)}
.fbtn{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15.5px;min-height:54px;padding:0 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.fbtn[aria-expanded="true"]{border-color:var(--ink)}
.fbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.fpop{position:absolute;left:0;top:calc(100% + 8px);z-index:45;width:min(400px,calc(100vw - 2*var(--gut)));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.fpop .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.chipsline{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-top:12px;font-size:14.5px;min-height:0}
.chipsline:empty{display:none}
.fchip{border:0;background:none;padding:6px 0;color:var(--ink);font-size:14.5px}
.fchip i{font-style:normal;color:var(--ink-2);margin-left:6px}
.fchip:hover i{color:var(--ink)}
/* результаты */
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 26px;padding:0 0 22px;font-size:15px}
.meta .cnts{color:var(--ink-2)}.meta .cnts b{color:var(--ink)}
.meta .right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
.sortsel{border:0;background:none;font-weight:700;padding:6px 2px;color:var(--ink)}
.vsw{display:flex;gap:18px}
.vsw button{border:0;background:none;padding:6px 0;color:var(--ink-2);font-size:15px}

const SeasonEngine={
  weights(){const w=new Array(12).fill(0),n=nights();for(let i=0;i<n;i++)w[addDays(pd(S.start),i).getMonth()]+=1/n;return w},
  city(a){return a>=18&&a<=27?100:a<18?Math.max(0,100-(18-a)*7):Math.max(0,100-(a-27)*8)},
  beach(a,sea){if(sea==null)return 0;let s=sea>=24?100:sea>=22?80:sea>=20?55:sea>=18?25:10;if(a<24)s-=(24-a)*6;if(a>35)s-=(a-35)*6;return clamp(s/100)*100},
  nature(a){return a>=14&&a<=26?100:a<14?Math.max(0,100-(14-a)*7):Math.max(0,100-(a-26)*8)},
  ski(a){return a<=3?95:a<=6?78:a<=9?45:10},
  /** пригодность месяца для вида отдыха */
  suit(d,m,kind){const a=d.air[m],rain=d.rain.includes(m+1);let s;
    if(kind==='beach') s=this.beach(a,d.sea?d.sea[m]:null)-(rain?30:0);
    else if(kind==='ski') s=this.ski(a);
    else if(kind==='nature'||kind==='mountains'||kind==='active') s=this.nature(a)-(rain?20:0);
    else s=this.city(a)-(rain?15:0);
    return clamp(s/100)*100},
  /** «собственный» сезон направления — лучший из его видов отдыха */
  own(d,m){const ks=[];if(d.acts.includes('beach'))ks.push('beach');if(d.acts.includes('ski'))ks.push('ski');if(d.acts.some(a=>a==='nature'||a==='mountains'||a==='active'))ks.push('nature');if(d.acts.some(a=>['excursion','gastro','shopping','historic','mixed'].includes(a))||!ks.length)ks.push('city');return Math.max(...ks.map(k=>this.suit(d,m,k)))},
  code(v){return v>=85?'H':v>=68?'S':v>=45?'L':'O'},
  analyze(d,w){const own=d.air.map((_,m)=>this.own(d,m));const wav=a=>a.reduce((s,v,i)=>s+v*w[i],0);
    const dom=w.indexOf(Math.max(...w));
    return {own,score:wav(own),code:this.code(wav(own)),air:wav(d.air),sea:d.sea?wav(d.sea):null,rain:d.rain.reduce((s,m)=>s+w[m-1],0),dom};
  }
};

const REST=[['beach','Пляжный','🏖'],['passive','Пассивный','🌿'],['active','Активный','🚴'],['excursion','Экскурсионный','🏛'],['gastro','Гастрономический','🍽'],['nature','Природа','🌲'],['mountains','Горы','⛰'],['shopping','Шопинг','🛍'],['mixed','Смешанный','✨']];

const TEMP={hot:[30,36,'Жарко'],warm:[24,30,'Тепло'],mild:[17,24,'Умеренно']};
const PreferenceEngine={
  has(d,r){const A=d.acts;if(r==='mountains')return A.includes('mountains')||A.includes('ski');if(r==='passive')return A.includes('passive')||A.includes('island');if(r==='nature')return A.includes('nature')||A.includes('island');if(r==='excursion')return A.includes('excursion')||A.includes('historic');return A.includes(r)},
  type(d,w){const types=S.rest.length?S.rest:['mixed'];let sum=0;
    for(const r of types){
      if(r==='beach') sum+=this.has(d,'beach')?d.air.reduce((s,_,m)=>s+SeasonEngine.suit(d,m,'beach')*w[m],0):0;
      else if(r==='mixed') sum+=d.acts.length>=4?90:60;
      else sum+=this.has(d,r)?100:(r==='passive'?45:15);
    }
    let s=sum/types.length;if(S.pace==='calm'&&!this.has(d,'passive'))s-=8;if(S.pace==='intense'&&!this.has(d,'excursion'))s-=10;
    return clamp(s/100)*100},
  weather(se){const [lo,hi]=TEMP[S.temp];const dist=se.air<lo?lo-se.air:se.air>hi?se.air-hi:0;return clamp((100-dist*9-se.rain*30)/100)*100},
  family(d,ctx){
    if(!S.children.length) return null;
    const base={resort:.9,island:.85,city:.72,historic:.65,ski:.72,nature:.72,mountain:.65}[d.kind]||.7;
    const per=S.children.map(a=>{let v=base;
      if(a<2){if(ctx.hours>7)v-=.15;if(ctx.air>33)v-=.1}
      else if(a<6){if(d.kind==='city')v-=.06;if(this.has(d,'beach'))v+=.05;if(ctx.hours>9)v-=.1;if(ctx.air>34)v-=.08}

      return clamp(v)});
    return per.reduce((s,v)=>s+v,0)/per.length*100}
};

      const best=fl.opts.find(o=>o.optimal);const hot=HotelEngine.tiers(d,mult),t=hot.tiers[S.tier];
      const saf=SafetyEngine.get(d.cc),tr=getTransportData(d),tzDiff=(tzOffset(d.tz,S.start)??5)-5;
      const family=calculateFamilyScore(d,{hours:best.doorAll,air:se.air,stops:best.stops,tzDiff});
      const fee=0,total=best.totalAll+t.stay+fee;
      const lims=[S.budgetTotal?total/S.budgetTotal:0,S.budgetPP?total/pax()/S.budgetPP:0];
      if(Math.max(...lims)>1.35&&!cm)return reject(d,'budget',approx(total));
      const r={d,se,type,fl,best,hot,saf,tr,tzDiff,family,total,mult,entry:getEntryRules(d.cc),tours:getTourOffers(d)};
      Object.assign(r,calculateDestinationScore(d,{se,type,family,total,best,tr,hot,saf}));
      reasons(r);full.push(r);
    });
    const gated=full.filter(r=>r.saf.lv==='red');let ok=full.filter(r=>r.saf.lv!=='red');
    if(S.travelMode==='tour'){ok.filter(r=>!tourAvail(r)).forEach(r=>rej[r.d.id]={code:'notour'});ok=ok.filter(tourAvail)}
    if(S.fSafety&&S.fSafety!=='any'){const lv=S.fSafety==='green'?['green']:['green','yellow'];ok.filter(r=>!lv.includes(r.saf.lv)).forEach(r=>rej[r.d.id]={code:'fsafety'});ok=ok.filter(r=>lv.includes(r.saf.lv))} // «нет данных» не считается обычной ситуацией
    if(S.fFamily&&S.children.length){ok.filter(r=>!(r.family>=80)).forEach(r=>rej[r.d.id]={code:'ffamily'});ok=ok.filter(r=>r.family>=80)}
    let ranked=rankDestinations(ok);
    // разнообразие: в первой дюжине не больше CONFIG.countryCap направлений одной страны
    const head=[],tail=[],cnt={};ranked.forEach(r=>{if(head.length<CONFIG.pageSize&&(cnt[r.d.cc]||0)<CONFIG.countryCap&&!cm){head.push(r);cnt[r.d.cc]=(cnt[r.d.cc]||0)+1}else tail.push(r)});
    ranked=cm?ranked:head.concat(tail);
    const fit=ranked.filter(r=>r.match>=CONFIG.fit);
    S.results={all:full,ranked,fit,gated,rej,analyzed:all.length,preCount:pre.length,w,country:S.destCountry,countryTotal:cm?all.filter(d=>d.cc===S.destCountry).length:0,pinned:null};
    S.shown=CONFIG.pageSize;
    if(S.destCity&&WorldDB.byId[S.destCity]){S.results.pinned=full.find(r=>r.d.id===S.destCity)||this.force(S.destCity);S.selected=S.destCity}
    else if(S.selected&&!full.find(r=>r.d.id===S.selected))S.selected=null;
    saveHistory();
  },
  explain(id){
    const d=WorldDB.byId[id];if(!d)return null;const res=S.results;const r=res.all.find(x=>x.d.id===id);
    if(r&&res.pinned===r&&res.ranked.indexOf(r)<0&&!res.rej[id])return {d,r,kind:'ranked',text:`${d.ru} выбран вами и посчитан полностью (${r.match}%).`};
    const j0=res.rej[id];
    if(r&&res.ranked.indexOf(r)<0&&r.saf.lv!=='red'&&j0&&j0.code==='notour')return {d,r,kind:'rej',text:`${d.ru} прошёл подбор (${r.match}%), но скрыт режимом «Готовый тур»: ${REASON.notour.toLowerCase()} (Kaspi Travel — по списку стран Kaspi Гид; Kaztour — по страницам направлений). Переключите «Как хотите путешествовать?» на «Показать оба варианта».`,can:true};
    if(r&&(res.ranked.indexOf(r)>=0||r.saf.lv==='red')){const pos=res.ranked.indexOf(r);
      if(r.saf.lv==='red')return {d,r,kind:'gated',text:`${d.ru} не исключён: он в разделе «Требует внимания», потому что ${r.saf.s!=='—'?'по данным '+r.saf.s:'по снимку'}: ${r.saf.t}`};
      const weak=Object.keys(r.W).filter(k=>r.W[k]).sort((a,b)=>r.sc[a]-r.sc[b]).slice(0,2).map(k=>`${FLBL[k].toLowerCase()} ${Math.round(r.sc[k])}%`);
      return {d,r,kind:'ranked',text:`${d.ru} прошёл все фильтры и стоит на ${pos+1}-м месте из ${res.ranked.length} (${r.match}%). Ниже всего оценки: ${weak.join(', ')}.${r.cap<100?` Итог ограничен ${r.cap}% из-за предупреждений безопасности.`:''}`}}
    const j=res.rej[id];if(!j)return r?{d,r,kind:'ranked',text:`${d.ru} открыт вне выдачи и посчитан полностью (${r.match}%).`}:{d,kind:'none',text:`${d.ru} есть в каталоге, но не анализировался.`};
    if(j.code==='where')return {d,kind:'rej',text:`${d.ru} (${d.country.name}) не показан, потому что в фильтре «Куда» выбрана страна ${ccName(S.destCountry)}. Сбросьте страну или откройте город отдельно.`,can:true};
    if(j.code==='lowpre')return {d,kind:'rej',text:`${d.ru} есть в каталоге и прошёл жёсткие фильтры, но по предварительной оценке (сезон, тип отдыха, значимость) не вошёл в ${CONFIG.preTop} лучших, для которых строятся маршруты. Откройте его, чтобы посчитать полностью.`,can:true};
    return {d,kind:'rej',text:`${d.ru} не исключён из каталога. ${REASON[j.code]}${j.extra?` (${j.extra})`:''}.`,can:j.code!=='noair'}
  },
  /** Полный расчёт одного направления вне выдачи (для «Почему нет» и «Куда») */
  force(id){const d=WorldDB.byId[id],w=S.results.w,se=calculateSeasonScore(d,w),type=PreferenceEngine.type(d,w),mult=({H:1.2,S:1,L:.88,O:.8})[se.code];

    S.results.all.push(r);return r}
};
function reasons(r){
  const d=r.d,why=[],care=[],sea=r.se.sea!=null?Math.round(r.se.sea):null,air=Math.round(r.se.air),has=a=>PreferenceEngine.has(d,a);
  if(r.sc.season>=85)why.push(`${SEASON_LBL[r.se.code]}: погода соответствует типу направления`);else if(r.sc.season>=68)why.push('Хороший сезон для этих дат');
  if(S.rest.includes('beach')&&has('beach')&&sea>=23)why.push(`Тёплое море: около ${sea}°`);
  if(r.sc.weather>=85)why.push(`Комфортная температура: днём около ${air}°`);
  if(r.sc.type>=85)why.push(`Подходит под ${S.rest.map(x=>RESTP[x]).slice(0,2).join(' и ')||'ваш формат'}`);
  if(r.family!=null&&r.family>=80)why.push(`Подходит детям (${S.children.map(ageLbl).join(', ')})`);
  if(r.best&&r.sc.flight>=70)why.push(`Удобная дорога: ${r.best.stops?`${r.best.stops} ${plural(r.best.stops,['пересадка','пересадки','пересадок'])}`:'прямой рейс'}, ~${hm(r.best.doorAll)} с трансфером`);
  if(r.best&&r.best.origin!==S.home&&r.best.vsHome>15000)why.push(`Выгоднее лететь из города ${cityOf(r.best.origin)} (≈ −${money(r.best.vsHome)})`);
  if(r.sc.budget>=90)why.push(S.budgetTotal||S.budgetPP?'Укладывается в ваш бюджет':'Уровень цен соответствует бюджету');
  if(r.hot.real.length)why.push(`${r.hot.real.length} ${plural(r.hot.real.length,['реальный отель','реальных отеля','реальных отелей'])} с прямыми ссылками на Booking.com`);
  if(r.saf.lv==='red')care.push('МИД РК рекомендует воздержаться от поездок');else if(r.saf.lv==='orange')care.push('МИД РК: существенные ограничения / необязательные поездки не рекомендуются');else if(r.saf.lv==='unknown')care.push('Нет данных МИД РК в снимке — проверьте перед поездкой');
  if(r.best&&r.best.tSafety.length)care.push(`Пересадка в стране с предупреждением МИД РК: ${[...new Set(r.best.tSafety.map(s=>WorldDB.countries[s.cc].name))].join(', ')}`);
  if(r.entry.code==='required'||r.entry.schengen)care.push(r.entry.schengen?'Нужна шенгенская виза':'Нужна виза');else if(r.entry.code==='evisa')care.push('Нужна электронная виза');
  if(air>=33)care.push(`Жарко днём: около ${air}°`);
  if(r.se.rain>=.3)care.push('Сезон дождей');
  if(S.rest.includes('beach')&&has('beach')&&sea!=null&&sea<21)care.push(`Море прохладное: ~${sea}°`);
  if(S.rest.includes('beach')&&!has('beach'))care.push('Без пляжного отдыха');
  if(r.best&&r.best.self)care.push('Оптимальный маршрут — с самостоятельной пересадкой');
  if(r.best&&r.best.doorAll>S.maxHours)care.push(`Дорога дольше вашего лимита: ~${hm(r.best.doorAll)}`);
  if(Math.abs(r.tzDiff)>=5)care.push(`Разница во времени ${r.tzDiff>0?'+':''}${r.tzDiff} ч`);
  if(d.country.price===3)care.push('Цены выше среднего');
  if(!r.hot.real.length)care.push('Конкретные отели не подобраны — поиск на Booking.com');
  if(d.src==='auto')care.push('Город добавлен автоматически: виды отдыха не размечены вручную');
  r.why=why;r.care=care;
}

function drawMap(){
  const cv=$('#map');if(!cv)return;const g=cv.getContext('2d'),Wd=cv.width,H=cv.height,css=getComputedStyle(document.documentElement);
  const X=lon=>(lon+180)/360*Wd,Y=lat=>(80-lat)/140*H;
  g.fillStyle=css.getPropertyValue('--surface-3');g.fillRect(0,0,Wd,H);
  g.fillStyle=css.getPropertyValue('--ink-3');g.globalAlpha=.35;
  Object.values(WorldDB.airports).forEach(a=>{if(a[3]<-60)return;g.beginPath();g.arc(X(a[4]),Y(a[3]),1.6,0,7);g.fill()});g.globalAlpha=1;
  const home=apInfo(S.home);g.fillStyle=css.getPropertyValue('--ink');g.beginPath();g.arc(X(home.lon),Y(home.lat),5,0,7);g.fill();
  mapPts=[];const R=S.results,items=R.ranked.slice(0,150).concat(R.gated);
  items.slice().reverse().forEach(r=>{const x=X(r.d.lon),y=Y(r.d.lat),red=r.saf.lv==='red';
    g.fillStyle=css.getPropertyValue(red?'--bad':r.match>=85?'--ok':r.match>=70?'--accent':'--warn');
    const rad=r.d.id===S.selected?8:4+r.match/40;g.beginPath();g.arc(x,y,rad,0,7);g.fill();
    if(r.d.id===S.selected){g.strokeStyle=css.getPropertyValue('--ink');g.lineWidth=2;g.stroke()}
    mapPts.push({x,y,r})});
}
function mapHit(e){const cv=$('#map');const b=cv.getBoundingClientRect(),sx=cv.width/b.width,x=(e.clientX-b.left)*sx,y=(e.clientY-b.top)*sx;let best=null,bd=14*sx;mapPts.forEach(p=>{const dd=Math.hypot(p.x-x,p.y-y);if(dd<bd){bd=dd;best=p}});return {best,b,x:e.clientX-b.left,y:e.clientY-b.top}}

function compareHTML(){const rs=S.compare.map(id=>S.results.all.find(r=>r.d.id===id)).filter(Boolean);

  const best=(vals,low)=>{const n=vals.filter(v=>typeof v==='number');const t=low?Math.min(...n):Math.max(...n);return vals.map(v=>v===t&&n.length>1)};
  const rows=[['Подходит',rs.map(r=>r.match),v=>v+'%'],['Безопасность',rs.map(r=>SAFETY_LBL[r.saf.lv])],['Сезон',rs.map(r=>SEASON_LBL[r.se.code])],['Воздух днём',rs.map(r=>Math.round(r.se.air)+'°')],['Море',rs.map(r=>r.se.sea!=null&&PreferenceEngine.has(r.d,'beach')?Math.round(r.se.sea)+'°':'—')],
    ['Въезд',rs.map(r=>r.entry.label)],['Маршрут (DEMO)',rs.map(r=>{const f=selFlight(r);return f?f.path.map(cityOf).join(' → '):'—'})],['Пересадки',rs.map(r=>selFlight(r)?selFlight(r).stops:9),v=>v===9?'—':String(v),true],['В пути',rs.map(r=>selFlight(r)?selFlight(r).doorAll:99),v=>v===99?'—':hm(v),true],['Билет',rs.map(r=>selFlight(r)?(selFlight(r).self?'⚠️ раздельные':'единый'):'—')],
    ['Перелёт (оценка)',rs.map(r=>tripCost(r,S.tier).fl),approx,true],['Отель',rs.map(r=>{const h=r.hot.tiers[S.tier];return h.estimated?'не выбран':h.name})],['Рейтинг / отзывы',rs.map(()=>'проверить на Booking')],['Завтрак',rs.map(()=>'проверить')],['Транспорт',rs.map(r=>r.tr.text)],
    ['Проживание (оценка)',rs.map(r=>tripCost(r,S.tier).stay),approx,true],['Полная стоимость',rs.map(r=>tripCost(r,S.tier).total),approx,true],['На человека',rs.map(r=>tripCost(r,S.tier).per),approx,true],

    ['🧳 Kaspi Travel',rs.map(r=>tourView(r).kaspi?'туры в страну есть — цена в приложении Kaspi':'по Kaspi Гид туров нет')]];
  return `<div class="mhead"><h3>Сравнение · ${rs.length} из 4</h3><button class="icon-btn" data-act="mclose" aria-label="Закрыть">✕</button></div>
  <div class="tbl"><table><thead><tr><th></th>${rs.map(r=>`<th style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)">${flagOf(r.d.cc)} ${esc(r.d.ru)}<br><button class="linkbtn" data-act="cmp" data-v="${r.d.id}">убрать</button></th>`).join('')}</tr></thead><tbody>

function tripText(r){const c=tripCost(r,S.tierSel[r.d.id]||S.tier),f=c.f;
  return `# Поездка: ${r.d.ru} (${r.d.country.name})\n\n- Даты: ${dLong(S.start)} — ${dLong(S.end)} (${nights()} н.)\n- Путешественники: ${partyText()}\n- Подходит: ${r.match}%\n- Безопасность: ${SAFETY_LBL[r.saf.lv]} (источник: ${r.saf.s}, ${r.saf.d})\n- Въезд: ${r.entry.label}${r.entry.stay?', '+r.entry.stay:''}\n\n## Перелёт (DEMO — проверить)\n${f?`- ${f.pos?cityOf(f.pos.from)+' ⇢ ':''}${f.path.map(c=>cityOf(c)+' ('+c+')').join(' → ')}\n- ${f.stops} пересадок, ~${hm(f.doorAll)}, ${f.self?'раздельные билеты':'единый билет'}\n- ≈ ${money(c.fl)}\n- Проверить: ${flightLinks(r.d,f.origin,f.ap.code).av}`:'- нет маршрута'}\n\n## Проживание (оценка)\n- ${c.h.estimated?'отель не выбран':c.h.name}: ≈ ${money(c.stay)}\n- Booking: ${c.h.estimated?c.h.searchUrl:c.h.bookingUrl}\n\n## Итого (самостоятельно)\n- ≈ ${money(c.total)} (≈ ${money(c.per)} на человека)\n- Не включено: трансфер, налоги, багаж, страховка\n\n## Готовые туры\n${tourExportText(r)}\n\nПочему подходит:\n${r.why.map(x=>'- '+x).join('\n')}\n\nЧто учесть:\n${r.care.map(x=>'- '+x).join('\n')}\n\nСформировано Travel Expert ${new Date().toLocaleString('ru-RU')}. Цены и рейсы — оценка.\n`}
function toICS(r){const f=x=>x.replace(/-/g,'');return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Travel Expert//RU\r\nBEGIN:VEVENT\r\nUID:${r.d.id}-${S.start}@travel-expert\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${f(S.start)}\r\nDTEND;VALUE=DATE:${f(S.end)}\r\nSUMMARY:Поездка: ${r.d.ru}\r\nDESCRIPTION:${tripText(r).replace(/\n/g,'\\n').slice(0,900)}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`}
/** Сохранение файла: в окне Claude — через downloads (с таймаутом), на обычном сайте — через ссылку-Blob */
async function saveFile(filename,data,mime){let dl=null;try{if(window.claude&&window.claude.use)dl=await withTimeout(window.claude.use('downloads'),4000,'Экспорт')}catch(e){}
  if(dl){try{await withTimeout(dl.save({filename,data}),15000,'Экспорт');return}catch(e){showErr('Экспорт не выполнен: скачивание недоступно в этом окне.');return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function safeHTML(fn){try{return fn()}catch(e){console.error('[Travel Expert]',e);return '<div class="modfail">Раздел временно недоступен.</div>'}}
async function doExport(kind){const r=cur();if(!r)return;const name=`travel-${r.d.en.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${S.start}`;
  const md=tripText(r);const data=kind==='md'?md:kind==='html'?`<!doctype html><meta charset="utf-8"><title>${esc(r.d.ru)}</title><pre style="font:15px/1.5 system-ui;white-space:pre-wrap;max-width:760px;margin:40px auto">${esc(md)}</pre>`:toICS(r);
  let dl=null;try{if(window.claude&&window.claude.use)dl=await withTimeout(window.claude.use('downloads'),4000,'Экспорт')}catch(e){}
  if(dl&&kind!=='ics'){try{await withTimeout(dl.save({filename:`${name}.${kind}`,data}),15000,'Экспорт')}catch(e){showErr('Экспорт не выполнен: скачивание недоступно в этом окне.')}return}
  if(dl&&kind==='ics'){alertMsg('В окне Claude календарный файл недоступен. Откройте index.html в браузере.');return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:kind==='ics'?'text/calendar':kind==='html'?'text/html':'text/markdown'}));a.download=`${name}.${kind}`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function onAct(a,v){

    case 'rest':S.rest=S.rest.includes(v)?S.rest.filter(x=>x!==v):[...S.rest,v];renderParams();renderAskMeta();break;
    case 'temp':S.temp=v;renderParams();renderAskMeta();break;
    case 'pace':S.pace=v;renderParams();break;
    case 'tier':S.tier=v;renderParams();renderAskMeta();break;

    case 'genius':S.genius=v;renderParams();renderDetails();break;

    case 'select':select(v);break;

    case 'whyclose':S.whyNot=null;renderResults();break;
    case 'force':{if(!S.results.all.find(r=>r.d.id===v))ResultsEngine.force(v);S.whyNot=null;select(v);break}
    case 'dtab':S.dtab=v;renderDetails();$('#details').scrollTop=0;break;
    case 'dtier':S.tierSel[S.selected]=v;renderDetails();break;
    case 'flight':S.flightSel[S.selected]=v;renderDetails();break;
    case 'dclose':S.selected=null;renderResults();renderDetails();break;
    case 'cmp':{if(S.compare.includes(v))S.compare=S.compare.filter(x=>x!==v);else if(S.compare.length<4)S.compare.push(v);else{S.compare.shift();S.compare.push(v)}renderResults();renderTray();if(!$('#modal').hidden)openModal(compareHTML());break}
    case 'save':toggleSave(v);renderResults();renderDetails();if(!$('#modal').hidden&&$('#mbody').textContent.includes('Сохранённое'))openModal(savedHTML());break;
    case 'open-compare':openModal(compareHTML());break;

    case 'mclose':$('#modal').hidden=true;break;
    case 'restore':{const [k,x]=v.split(':');const it=k==='s'?store.get('saved',[]).find(s=>s.id===x):store.get('history',[])[+x];if(!it)break;Object.assign(S,JSON.parse(JSON.stringify(it.p)));$('#modal').hidden=true;run().then(ok=>{if(ok&&k==='s'){if(!S.results.all.find(r=>r.d.id===x))ResultsEngine.force(x);select(x)}});break}
    case 'export':doExport(v);break;
    case 'dmode':{S.destMode=v;if(v==='any'){const ch=!!S.destCountry;S.destCountry='';S.destCity='';S.pick=null;if(ch)run();else{renderParams();renderAskMeta()}}

      else{S.pick=v==='country'&&!S.destCountry?'country':null;renderParams();setTimeout(()=>{const x=$(v==='city'?'#cityQ':'#pickQ');if(x)x.focus()})}break}
    case 'pick':S.pick=S.pick===v?null:v;renderParams();setTimeout(()=>{const x=$('#pickQ');if(x)x.focus()});break;
    case 'pick-country':S.destMode='country';S.destCountry=v;S.destCity='';S.pick=null;S.selected=null;run();break;
    case 'pick-country-tour':$('#modal').hidden=true;S.destMode='country';S.destCountry=v;S.destCity='';S.pick=null;S.selected=null;run();break;
    case 'clr-country':S.destCountry='';S.destCity='';S.pick=S.destMode==='country'?'country':null;S.selected=null;run();break;
    case 'pick-city':{const d=WorldDB.byId[v];if(!d)break;S.destCity=v;S.destCountry=d.cc;if(S.destMode==='any')S.destMode='city';run();if(innerWidth<=900)$('#details').classList.remove('hidden-m');break}

    case 'tmode':S.travelMode=v;run();break;
    case 'go-self':case 'go-tours':case 'go-cmp':openTab(v,{'go-self':'self','go-tours':'tours','go-cmp':'cost'}[a]);break;

    case 'mt-edit':{const o=ManualStore.all().find(x=>x.id===v);if(o)openModal(manualFormHTML(o));break}
    case 'mt-del':if(S.delPending===v){ManualStore.del(v);S.delPending=null;showInfo('Предложение удалено')}else S.delPending=v;renderResults();renderDetails();break;

    case 'chat-close':$('#drawer').hidden=true;$('#fab').hidden=false;break;
  }

let sampleFn=null,aiReady=false,chatTurns=[];
function parseLocal(text){
  const s=text.toLowerCase(),p={};
  const mons=['январ','феврал','март','апрел','ма[йея]','июн','июл','август','сентябр','октябр','ноябр','декабр'];let m=-1;mons.forEach((k,i)=>{if(new RegExp('(^|\\s)'+k).test(s))m=i});if(/майск/.test(s))m=4;
  let n=null;const dn=s.match(/(\d+)\s*(дн|дня|дней|сут)/),nn=s.match(/(\d+)\s*(ноч)/);if(nn)n=+nn[1];else if(dn)n=Math.max(1,+dn[1]-1);else if(/две недели/.test(s))n=14;else if(/недел/.test(s))n=7;
  if(m>=0){let y=today0.getFullYear();if(m<today0.getMonth()||(m===today0.getMonth()&&today0.getDate()>12))y++;const st=new Date(y,m,/майск/.test(s)?1:12);p.start=iso(st);p.end=iso(addDays(st,n||7))}else if(n){p.start=S.start;p.end=iso(addDays(pd(S.start),n))}
  const words={'один':1,'одна':1,'двое':2,'два':2,'две':2,'трое':3,'три':3,'четверо':4,'четыре':4};
  const am=s.match(/(\d+|один|одна|двое|два|две|трое|три|четверо|четыре)\s*взросл/);if(am)p.adults=words[am[1]]||+am[1];else if(/вдво[её]м|с мужем|с женой|пара/.test(s))p.adults=2;
  const kids=[];const re=/(\d{1,2})\s*(год|года|лет)(?!\s*назад)/g;let k;while((k=re.exec(s)))kids.push(+k[1]);if(kids.length)p.children=kids;else if(/без дет/.test(s))p.children=[];

const HCAT={'5':'5★','4':'4★','3':'3★','2':'2★','1':'1★',apt:'апартаменты',none:'без категории',na:'не указана'};
const TOUR_CURRENCIES=['KZT','USD','EUR','RUB'];
const ruDate=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return `${d}.${m}.${y}`};
const toIsoDate=s=>{s=String(s||'').trim();let m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null};
const statusBadge=(st,date)=>`<span class="st st-${st}" title="${esc(DATA_STATUS[st]?DATA_STATUS[st].text:'')}">${DATA_STATUS[st]?DATA_STATUS[st].emoji+' '+DATA_STATUS[st].label:''}${date?` · ${esc(date)}`:''}</span>`;
const oneLine=(s,max=2000)=>String(s??'').replace(/\s+/g,' ').trim().slice(0,max);

/* ---------- единая структура тура ----------
   TourOffer: id, providerId, source, status, checked(ISO), destId, cc, city, from, dep, ret, nights,
   adults, childAges[], children, hotel, hotelCat, meal, flight, airline, baggage, baggageText, transfer, insurance,
   currency, price, pricePP, priceKZT, fx, included, excluded, url, urlKind('offer'|'search'), comment, manual, area, rating, expired */
function normalizeTour(raw){
  const e=[],w=[],o={};
  o.id=raw.id||('t'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36));
  o.providerId=raw.providerId||'manual';
  const P=ProviderRegistry.byId[o.providerId];
  o.source=oneLine(raw.source||(P&&P.name),80);if(!o.source)e.push('Источник');
  o.status=DATA_STATUS[raw.status]?raw.status:'snap';
  o.checked=toIsoDate(raw.checked);if(!o.checked)e.push('Дата проверки');
  const d=WorldDB.byId[raw.destId];if(!d)e.push('Город/курорт из каталога');
  o.destId=d?d.id:null;o.cc=d?d.cc:null;o.city=d?d.ru:'';
  o.from=oneLine(raw.from,40);if(!o.from)e.push('Город вылета');
  o.dep=toIsoDate(raw.dep);if(!o.dep)e.push('Дата вылета');
  o.ret=toIsoDate(raw.ret);
  let n=parseInt(raw.nights,10);
  if(o.dep&&o.ret){const dn=diffDays(o.dep,o.ret);if(dn<=0)e.push('Дата возвращения должна быть позже вылета');else{if(!n)n=dn;else if(n!==dn&&n!==dn-1)w.push(`Указано ${n} ноч., а между датами ${dn} дн. — проверьте`)}}
  if(!(n>0&&n<60))e.push('Количество ночей');o.nights=n>0?n:null;
  if(!o.ret&&o.dep&&o.nights)o.ret=iso(addDays(pd(o.dep),o.nights));
  o.adults=parseInt(raw.adults,10);if(!(o.adults>=1&&o.adults<=10))e.push('Взрослых — от 1 до 10');
  o.childAges=(Array.isArray(raw.childAges)?raw.childAges:[]).map(Number).filter(a=>Number.isFinite(a)&&a>=0&&a<=17).slice(0,6);o.children=o.childAges.length;
  o.hotel=oneLine(raw.hotel,120);if(!o.hotel)w.push('Отель не указан');
  o.hotelCat=HCAT[raw.hotelCat]?String(raw.hotelCat):'na';
  o.meal=MEAL[raw.meal]?raw.meal:'NA';
  ['flight','baggage','transfer','insurance'].forEach(k=>{o[k]=TRI[raw[k]]?raw[k]:'na'});
  o.airline=oneLine(raw.airline,80);o.baggageText=oneLine(raw.baggageText,80);
  o.currency=TOUR_CURRENCIES.includes(raw.currency)?raw.currency:'KZT';
  o.price=Math.round(+raw.price);if(!(o.price>0))e.push('Общая стоимость');
  const px=(o.adults||0)+o.children;
  o.pricePP=+raw.pricePP>0?Math.round(+raw.pricePP):(o.price>0&&px?Math.round(o.price/px):null);
  if(+raw.pricePP>0&&o.price>0&&px&&Math.abs(o.pricePP*px-o.price)>o.price*.03)w.push('Цена на человека × число туристов не равна общей цене (так бывает: дети дешевле) — проверьте');
  const rate=o.currency==='KZT'?1:CONFIG.currency.kztPer[o.currency];
  o.priceKZT=o.price>0&&rate?Math.round(o.price*rate):null;o.fx=o.currency!=='KZT';
  if(o.currency==='RUB')w.push('Цена в рублях: в сравнении с ₸ не участвует, пока не задан курс');
  o.included=oneLine(raw.included,600);o.excluded=oneLine(raw.excluded,600);o.comment=oneLine(raw.comment,600);
  o.url=oneLine(raw.url,600);if(o.url&&!/^https?:\/\/[^\s/]+\.[^\s]+/i.test(o.url))e.push('Ссылка должна начинаться с http:// или https://');
  o.urlKind=o.url?(raw.urlKind==='search'?'search':'offer'):null;
  o.manual=!!raw.manual;o.area=oneLine(raw.area,80);o.rating=raw.rating??null;o.createdAt=raw.createdAt||Date.now();o.pageDate=raw.pageDate||null;
  o.expired=!!(o.dep&&o.dep<iso(today0));
  if(o.expired)w.push('Дата вылета уже прошла — предложение сохранится, но в сравнение не попадёт');
  return {offer:o,errors:e,warnings:w}}
const tourEnd=o=>o.ret||iso(addDays(pd(o.dep),o.nights));
/** Сопоставление дат и состава: даты не меняются молча */
function tourMatch(o){const e=tourEnd(o),sameDates=o.dep===S.start&&e===S.end,shift=diffDays(S.start,o.dep);
  const party=o.adults===S.adults&&o.children===S.children.length;
  return {sameDates,shift,end:e,party,
    text:sameDates?'Даты совпадают с вашими':`Точные даты ${dShort(S.start)}–${dShort(S.end)} не найдены. Найден вариант ${dShort(o.dep)}–${dShort(e)} (${o.nights} н.)`,
    partyText:party?'Состав совпадает':`Цена указана для ${o.adults} взр.${o.children?` + ${o.children} дет.`:''} — для вашего состава (${partyText()}) проверьте у источника`}}

/* ---------- реестр поставщиков ----------
   Паспорт: id, name, kind('tour'|'flight'), category(A|B|C|D|M), defaultStatus, caps{prices,availability,meals,baggage,deepLink},
   legal{auto,store,note,checked}, mode('sync'|'async'|'link'), offers(d)→TourOffer[] (sync) | search(d,q)→Promise<TourOffer[]> (async),
   configured()→bool, searchUrl(d)→{url,label,kind,note}|null, timeoutMs */
const ProviderRegistry={list:[],byId:{},
  register(p){const x={kind:'tour',category:'C',defaultStatus:'snap',mode:'link',caps:{},legal:{},timeoutMs:12000,configured:()=>true,searchUrl:()=>null,...p};
    if(this.byId[x.id])throw new Error('Поставщик уже зарегистрирован: '+x.id);this.list.push(x);this.byId[x.id]=x;return x},
  tours(){return this.list.filter(p=>p.kind==='tour')},flights(){return this.list.filter(p=>p.kind==='flight')}};

/* ---------- настройки API (ключи хранятся только на сервере-прокси, в браузере — только адрес прокси) ---------- */
const ApiConfig={proxy:'',
  load(){try{const v=store.get('api',{});this.proxy=typeof v.proxy==='string'?v.proxy:''}catch(e){}},
  save(proxy){this.proxy=String(proxy||'').trim().replace(/\/+$/,'');store.set('api',{proxy:this.proxy})},
  ok(){return /^https:\/\/[^\s/]+\.[^\s]+/.test(this.proxy)}};
ApiConfig.load();
async function proxyGet(path,params,ms){if(!ApiConfig.ok())throw Object.assign(new Error('Прокси не настроен'),{code:'not_configured'});
  const u=new URL(ApiConfig.proxy+path);Object.entries(params||{}).forEach(([k,v])=>{if(v!=null&&v!=='')u.searchParams.set(k,v)});
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms||10000);
  try{const r=await fetch(u.toString(),{signal:ctl.signal});if(!r.ok)throw Object.assign(new Error(`Ответ ${r.status}`),{code:r.status===429?'rate_limit':'http_'+r.status});return await r.json()}
  catch(e){if(e.name==='AbortError')throw Object.assign(new Error('Превышено время ожидания'),{code:'timeout'});throw e}
  finally{clearTimeout(t)}}

/* ---------- хранилище ручных предложений (этот браузер + экспорт/импорт JSON) ---------- */
const ManualStore={items:null,
  all(){if(!this.items){const raw=store.get('manualTours',[]);this.items=(Array.isArray(raw)?raw:[]).map(x=>normalizeTour({...x,manual:true,providerId:'manual'}).offer).filter(o=>o.destId)}return this.items},
  save(o){const l=this.all();const i=l.findIndex(x=>x.id===o.id);if(i>=0)l[i]=o;else l.unshift(o);this.persist()},
  del(id){this.items=this.all().filter(x=>x.id!==id);this.persist()},
  persist(){store.set('manualTours',this.items);TourHub.invalidate()},
  exportJSON(){return JSON.stringify({app:'Travel Expert',kind:'manualTours',version:1,exported:new Date().toISOString(),items:this.all()},null,2)},
  importJSON(txt){const j=JSON.parse(txt);const arr=Array.isArray(j)?j:j.items;if(!Array.isArray(arr))throw new Error('В файле нет списка предложений');
    let ok=0,bad=0;arr.forEach(x=>{const r=normalizeTour({...x,manual:true,providerId:'manual'});if(r.errors.length){bad++;return}const l=this.all();if(!l.some(y=>y.id===r.offer.id)){l.push(r.offer);ok++}});this.persist();return {ok,bad}}};

/* ---------- TourHub: собирает предложения всех поставщиков в единый список ---------- */
const TourHub={cache:new Map(),rev:0,
  key(p,d){return `${p.id}|${d.id}|${S.start}|${S.end}|${S.adults}|${S.children.length}|${S.home}`},
  invalidate(){this.rev++;if(S.results)S.results.all.forEach(r=>{delete r.tours})},
  collect(d){const offers=[],prov={};
    ProviderRegistry.tours().forEach(p=>{
      try{
        if(p.mode==='sync'){const l=p.offers(d)||[];prov[p.id]={state:'ok',count:l.length};offers.push(...l)}
        else if(p.mode==='async'){const c=this.cache.get(this.key(p,d));prov[p.id]=c?{state:c.state,count:(c.offers||[]).length,msg:c.msg,at:c.at}:{state:p.configured()?'idle':'not_configured',count:0};if(c&&c.offers)offers.push(...c.offers)}
        else prov[p.id]={state:'link',count:0};
      }catch(e){console.error('[Travel Expert] поставщик',p.id,e);prov[p.id]={state:'error',count:0,msg:'Данные временно недоступны'}}});
    return {offers,prov}},
  /** Асинхронные поставщики — по запросу, каждый со своим таймаутом; отказ одного не влияет на остальных */
  async fetch(d){const ps=ProviderRegistry.tours().filter(p=>p.mode==='async'&&p.configured());
    await Promise.all(ps.map(async p=>{const k=this.key(p,d);
      try{const l=await withTimeout(p.search(d,{from:S.home,fromName:cityOf(S.home),start:S.start,end:S.end,nights:nights(),adults:S.adults}),p.timeoutMs,p.name);this.cache.set(k,{state:'ok',offers:l,at:Date.now()})}
      catch(e){this.cache.set(k,{state:e.code==='timeout'?'timeout':e.code==='awaiting_access'?'awaiting':'error',offers:[],msg:e.message,at:Date.now()})}}));
    this.invalidate()}};

/** Итог для направления: единый список предложений всех источников + состояние каждого поставщика */
function getTourOffers(d){try{
    const {offers,prov}=TourHub.collect(d);
    const cmp=(a,b)=>(a.priceKZT??Infinity)-(b.priceKZT??Infinity);
    const active=offers.filter(o=>!o.expired).sort(cmp),expired=offers.filter(o=>o.expired);
    return {offers:active,expired,prov,pages:KaztourProvider.notes(d),kaspi:{available:KASPI.countries.has(d.cc)},
      rev:TourHub.rev,links:ProviderRegistry.tours().filter(p=>p.mode==='link'||p.id==='kaztour').map(p=>({p,u:p.searchUrl(d)})).filter(x=>x.u),error:false}}
  catch(e){console.error('[Travel Expert] туры',e);return {offers:[],expired:[],prov:{},pages:[],kaspi:{available:false},links:[],error:true}}}

/* ---------- сравнение: самостоятельно ↔ тур (из любого источника) ---------- */
function tourOption(o){const fromTxt=`вылет: ${o.from}`;
  const tri=(k,label,extra)=>o[k]==='yes'?{inPack:true,text:`${label}: входит${extra?` · ${extra}`:''}`}:o[k]==='no'?{notIncl:true,text:`${label}: не входит — оплачивается отдельно`}:{text:`${label}: не указано у источника — проверить`};
  const c=[
    {key:'flight',label:'Перелёт',value:null,status:o.status,...tri('flight','перелёт',`${fromTxt}${o.airline?` · ${o.airline}`:' · авиакомпания не указана'}`)},
    {key:'hotel',label:'Отель',value:null,status:o.status,inPack:true,text:`${o.hotel||'отель не указан'}${o.hotelCat!=='na'?` · ${HCAT[o.hotelCat]}`:''}${o.area?` · ${o.area}`:''}${o.rating!=null?` · оценка ${o.rating} (не звёзды)`:''}`},
    {key:'meals',label:'Питание',value:null,status:o.status,...(o.meal==='NA'?{text:'не указано у источника — проверить'}:o.meal==='RO'?{notIncl:true,text:'Без питания (RO)'}:{inPack:true,text:MEAL[o.meal]})},
    {key:'transfer',label:'Трансфер',value:null,status:o.status,...tri('transfer','трансфер')},
    {key:'baggage',label:'Багаж',value:null,status:o.status,...tri('baggage','багаж',o.baggageText)},
    {key:'insurance',label:'Страховка',value:null,status:o.status,...tri('insurance','страховка')},
    {key:'extra',label:'Доп. расходы',value:null,status:'none',text:o.excluded?`не входит: ${o.excluded}`:'не рассчитано'}];
  return {kind:'tour',title:`🧳 ${o.source}`,components:c,total:o.priceKZT,totalOrig:o.price,currency:o.currency,per:o.pricePP,pax:o.adults+o.children,nights:o.nights,offer:o}}
function compareSelfTour(r,o){
  const t=tourOption(o);
  const q={start:o.dep,end:tourEnd(o),adults:o.adults,children:o.childAges.slice(),maxHours:Math.max(S.maxHours,40)};
  const s=selfOption(r,q);
  const known=s.components[0].value!=null&&s.components[1].value!=null&&t.total!=null;
  const diff=known?t.total-s.total:null;
  return {s,t,q,diff,known,sameParams:q.start===S.start&&q.end===S.end&&o.adults===S.adults&&o.children===S.children.length}}

function activeFilters(){const a=[],add=(k,label)=>a.push({k,label});
  S.rest.forEach(x=>{const f=FREST.find(y=>y[0]===x);if(f)add('rest:'+x,f[2])});
  if(S.temp!==FDEF.temp)add('temp',`Погода: ${TEMP[S.temp][2].toLowerCase()}`);
  if(S.pace!==FDEF.pace)add('pace',S.pace==='calm'?'Спокойный темп':'Насыщенный темп');
  if(S.travelMode==='self')add('travelMode','Только самостоятельно');if(S.travelMode==='tour')add('travelMode','Только готовые туры');
  TOUR_SRC_FILTER.forEach(id=>{if(S.tourSrc[id]===false&&TOUR_SRC_FILTER.some(k=>S.tourSrc[k]!==false))add('src:'+id,`Без источника: ${ProviderRegistry.byId[id].name}`)});
  if(S.maxStops===0)add('maxStops','Только прямой');if(S.maxStops===1)add('maxStops','До 1 пересадки');
  if(S.maxHours!==FDEF.maxHours)add('maxHours',S.maxHours>=24?'Время в пути без ограничения':`В пути до ${S.maxHours} ч`);
  if(S.maxLayover!==FDEF.maxLayover)add('maxLayover',`Стыковка до ${S.maxLayover} ч`);
  if(S.tier!==FDEF.tier)add('tier',S.tier==='budget'?'Бюджетный уровень':'Премиум-уровень');
