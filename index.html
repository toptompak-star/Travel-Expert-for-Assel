/* ---------- причины: индивидуально для направления и запроса ---------- */
function reasonCands(r){const d=r.d,A=d.acts,T=[],C=[],want=x=>S.rest.includes(x),sea=r.se.sea;
  if(PreferenceEngine.has(d,'beach')&&sea!=null&&sea>=23)T.push({k:'sea',s:sea>=26?'очень тёплое море':'тёплое море',w:want('beach')?3:2.2});
  if(A.includes('ski')&&SeasonEngine.suit(d,r.se.dom,'ski')>=75)T.push({k:'ski',s:'горнолыжный сезон',w:3});
  const TR={mountains:'горы',nature:'природа',historic:'история и архитектура',excursion:'экскурсии',gastro:'гастрономия',island:'остров',active:'активный отдых',shopping:'шопинг',passive:'спокойный отдых'};
  [...d.tags].forEach((c,i)=>{const t=TAGS[c];if(!TR[t])return;if(t==='excursion'&&A.includes('historic'))return;
    const asked=want(t)||(t==='historic'&&want('excursion'))||(t==='island'&&(want('nature')||want('passive')));T.push({k:t,s:TR[t],w:(asked?3:2)-.15*i})});
  if(r.best&&r.best.stops===0)C.push({k:'direct',s:'прямой рейс',w:1.5});
  if(r.best&&r.best.doorAll<=5)C.push({k:'short',s:'короткая дорога',w:1.7});
  if(r.family!=null&&r.family>=80)C.push({k:'kids',s:'подходит детям',w:1.6});
  if((S.budgetTotal||S.budgetPP)&&r.sc.budget>=90)C.push({k:'budget',s:'в рамках бюджета',w:1.8});
  if(r.sc.weather>=85)C.push({k:'weather',s:'комфортная погода',w:1.3});
  if(r.se.code==='H')C.push({k:'season',s:'лучший сезон',w:1.1});
  if(r.entry.code==='free'&&d.cc!=='KZ')C.push({k:'visa',s:'без визы',w:1});
  if(d.country.price===1)C.push({k:'cheap',s:'невысокие цены',w:1});
  return {T,C}}
function reasonFreq(R){if(R.rfreq)return R.rfreq;const f={},l=R.ranked.slice(0,60);l.forEach(r=>{const c=reasonCands(r);new Set([...c.T,...c.C].map(x=>x.k)).forEach(k=>f[k]=(f[k]||0)+1)});Object.keys(f).forEach(k=>f[k]/=Math.max(1,l.length));return R.rfreq=f}
/** 3 коротких причины: главная черта направления под запрос → лучшее условие поездки → самое отличительное из оставшегося */
function shortReasons(r){if(r._sr)return r._sr;const f=S.results?reasonFreq(S.results):{},{T,C}=reasonCands(r),sc=x=>x.w-1.2*(f[x.k]||0),by=(a,b)=>sc(b)-sc(a);
  const out=[],t=T.slice().sort((a,b)=>b.w-a.w)[0],c=C.slice().sort(by)[0];if(t)out.push(t);if(c)out.push(c);
  const by3=(a,b)=>(b.w-1.8*(f[b.k]||0))-(a.w-1.8*(f[a.k]||0));[...T,...C].filter(x=>!out.includes(x)).sort(by3).slice(0,3-out.length).forEach(x=>out.push(x));
  return r._sr=out.slice(0,3)}
const cap1=s=>s?s[0].toUpperCase()+s.slice(1):s;
function reasonLine(r){const l=shortReasons(r).map(x=>x.s);return l.length?cap1(l.join(' · ')):'Открыт по вашему запросу'}
function reasonList(r){const l=shortReasons(r).map(x=>x.k==='kids'&&S.children.length===1?`Подходит для ребёнка ${ageLbl(S.children[0])}`:cap1(x.s));return l.length?l:['Направление выбрано вами']}
const REST_GEN={beach:'пляжного отдыха',passive:'спокойного отдыха',active:'активного отдыха',excursion:'экскурсий',gastro:'гастрономии',nature:'отдыха на природе',mountains:'отдыха в горах',shopping:'шопинга',mixed:'разнообразного отдыха',historic:'знакомства с историей',island:'островного отдыха',ski:'катания на лыжах'};
function descLine(r){const d=r.d,k=S.rest.find(x=>PreferenceEngine.has(d,x))||d.acts.find(a=>REST_GEN[a])||'mixed',kids=S.children.length?(S.children.length===1?' с ребёнком':' с детьми'):'';
  if(r.se.code==='H'||r.se.code==='S')return `${SEASON_LBL[r.se.code]} для ${REST_GEN[k]}${kids}.`;
  return `${SEASON_LBL[r.se.code]} в ваши даты — подробности о погоде во вкладке «Обзор».`}

/* ---------- цены и статусы данных (мелкой серой подписью, без бейджей) ---------- */
const round1k=x=>Math.round(x/1000)*1000;
const ddmm=s=>{const [,m,d]=s.split('-');return `${d}.${m}`};
function selfPrice(r){return r.best?{txt:`от ≈ ${money(round1k(r.total/pax()))}`,cap:'DEMO + ESTIMATE'}:{na:'перелёт не рассчитан',cap:''}}
function tourPrice(r){const v=tourView(r);
  if(v.error)return {na:'данные временно недоступны',cap:''};
  if(v.min){const o=v.min,pp=o.pricePP||Math.round(o.price/(o.adults+o.children));return {txt:`от ${o.currency==='KZT'?money(pp):nf(pp)+' '+o.currency}`,cap:`${o.source} · ${DATA_STATUS[o.status].label} ${ddmm(o.checked)}`}}
  if(v.kaspi)return {na:'цена в Kaspi Travel',cap:''};
  if(v.pages.length)return {na:'предложений нет',cap:''};
  return {na:'туров нет',cap:''}}
function cardPhoto(d,w){const p=CITY_PHOTOS[d.id];return p&&p.length?{src:commonsSrc(p[0][0],w||800),page:commonsPage(p[0][0])}:null}

/* ---------- карточка направления ---------- */
function resRow(r,i,pin){const d=r.d,ph=cardPhoto(d),m=S.travelMode,sp=selfPrice(r),tp=tourPrice(r);
  const warn=r.saf.lv==='red'?'<span class="warnp red">🔴 МИД РК: воздержаться от поездок</span>':r.saf.lv==='orange'?'<span class="warnp">🟠 МИД РК: ограничения</span>':'';
  const line=(label,p)=>`<div class="dprice"><span>${label}</span><span class="pv">${p.txt?`<b>${p.txt} / чел.</b>`:`<span class="na">${p.na}</span>`}${p.cap?`<small>${esc(p.cap)}</small>`:''}</span></div>`;
  return `<article class="res ${S.selected===d.id?'sel':''} ${r.saf.lv==='red'?'gated':''}" data-act="select" data-v="${d.id}" tabindex="0" role="button" aria-label="${esc(d.ru)}, ${esc(d.country.name)}: подробнее">
    <div class="dph">${ph?`<img src="${esc(ph.src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<span class="nof" aria-hidden="true">${flagOf(d.cc)}</span>${warn}</div>
    <div class="dcb">
      <div><span class="cap">${flagOf(d.cc)} ${esc(d.country.name)}${pin?' · выбран вами':''}</span><div class="dttl"><h3>${esc(d.ru)}</h3><span class="fit">${r.match}% подходит</span></div></div>
      <div class="dwhy">${esc(reasonLine(r))}</div>
      <div class="dprices">${m!=='tour'?line('Самостоятельно',sp):''}${m!=='self'?line('Готовый тур',tp):''}</div>
      <span class="lnk">Подробнее →</span>
    </div></article>`}

/* ---------- результаты ---------- */
function renderResults(){
  const el=$('#results'),R=S.results;if(!el)return;
  if(!R){el.innerHTML='<div class="empty">Подбор ещё не рассчитан. Нажмите «Подобрать».</div>';return}
  const pin=R.pinned,list=R.ranked.filter(r=>r!==pin),shown=list.slice(0,S.shown);
  const rc={};Object.values(R.rej).forEach(j=>{if(j.code==='where')return;rc[j.code]=(rc[j.code]||0)+1});
  const wn=S.whyNot?ResultsEngine.explain(S.whyNot):null;
  const cch=R.country?`<div class="chead"><span class="cflag">${flagOf(R.country)}</span><div><span class="cap">Страна</span><h2>${esc(ccName(R.country))}</h2></div>
    <div class="ckpi"><span>Найдено направлений: <b>${R.countryTotal}</b></span><span>Подходят: <b>${R.fit.length}</b></span></div>
    <button class="quiet" type="button" data-act="clr-country">Любая страна ×</button></div>`:'';
  el.innerHTML=`<div class="meta"><span class="cnts"><b>${nf(R.analyzed)}</b> проанализировано · <b>${R.fit.length}</b> подходят · <b>${Math.min(S.shown,list.length)}</b> показано${R.gated.length?` · <b>${R.gated.length}</b> требуют внимания`:''}</span>
    <span class="right"><label class="muted">Сортировка: <select class="sortsel" data-chg="sort" aria-label="Сортировка">${[['opt','Оптимально'],['price','Дешевле'],['time','Быстрее']].map(([k,l])=>`<option value="${k}" ${S.sort===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <span class="vsw" role="group" aria-label="Вид"><button type="button" data-act="view" data-v="list" aria-pressed="${S.view==='list'}">Список</button><button type="button" data-act="view" data-v="map" aria-pressed="${S.view==='map'}">Карта</button></span></span></div>
  ${cch}
  ${wn?`<div class="card" style="margin-bottom:24px"><div class="row"><b>${flagOf(wn.d.cc)} ${esc(wn.d.ru)}</b><span class="muted small">${esc(wn.d.country.name)}</span><button class="quiet" type="button" data-act="whyclose" style="margin-left:auto">Закрыть</button></div><p style="margin-top:8px">${esc(wn.text)}</p>${wn.r||wn.can?`<div class="row" style="margin-top:12px"><button class="outl" type="button" data-act="force" data-v="${wn.d.id}">Открыть и посчитать</button></div>`:''}</div>`:''}
  ${S.view==='map'?`<div class="mapwrap"><canvas id="map" width="1400" height="640" aria-label="Карта направлений"></canvas><div class="maptip" id="maptip" hidden></div><div class="maplegend"><span><i style="background:var(--ok)"></i>≥ 85%</span><span><i style="background:var(--accent)"></i>70–84%</span><span><i style="background:var(--warn)"></i>&lt; 70%</span><span><i style="background:var(--bad)"></i>требует внимания</span><span><i style="background:var(--line-2)"></i>аэропорты</span></div></div>`:
  `${pin?`<div class="sechead" style="margin-top:0"><h3>Выбранный город</h3></div><div class="dgrid">${resRow(pin,null,true)}</div><div class="sechead"><h3>${R.country?'Другие направления: '+esc(ccName(R.country)):'Другие направления'}</h3></div>`:''}
   <div class="dgrid">${shown.map((r,i)=>resRow(r,i)).join('')}</div>
   ${shown.length?'':`<div class="empty">${S.travelMode==='tour'?'С готовыми турами в выбранных источниках ничего не нашлось. Попробуйте «Показать оба варианта».':'Под эти условия ничего не нашлось. Снимите часть фильтров или смените даты.'}${activeFilters().length?'<br><button class="lnk" type="button" data-act="freset" style="margin-top:10px">Очистить все фильтры</button>':''}</div>`}
   ${S.shown<list.length?`<div class="more"><button class="outl" type="button" data-act="more">Показать ещё ${Math.min(CONFIG.pageSize,list.length-S.shown)}</button></div>`:''}`}
  ${R.gated.length?`<div class="sechead"><h3>Требует внимания</h3></div><details ${S.gatedOpen||R.gated.some(r=>r.d.id===S.selected)?'open':''}><summary>🔴 ${R.gated.length} ${plural(R.gated.length,['направление','направления','направлений'])}: МИД РК рекомендует воздержаться от поездок. Они не удалены, но не входят в обычные рекомендации — показать</summary><div class="dgrid" style="margin-top:20px">${R.gated.map(r=>resRow(r,null)).join('')}</div></details>`:''}
  <div class="sechead"><h3>Не нашли город?</h3></div>
  <form class="whynot" id="whyForm"><input class="field" id="whyIn" list="destList" placeholder="Почему нет города…? Например, Мардин" autocomplete="off" aria-label="Проверить, почему города нет в выдаче"><button class="btn" type="submit">Проверить</button></form>
  <details style="margin-top:16px"><summary class="muted">Почему остальные направления не в выдаче</summary><div class="reasons" style="margin-top:10px">${Object.entries(rc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag">${k==='lowpre'?'Ниже по предварительной оценке':REASON[k]}: ${v}</span>`).join('')}</div><p class="small muted" style="margin-top:8px">Ни одно направление не удаляется молча: введите город в поле выше, и Travel Expert объяснит причину.</p></details>
  <datalist id="destList">${WorldDB.dests.filter(d=>d.sig>=3||d.src!=='auto').map(d=>`<option value="${esc(d.ru)}">`).join('')}</datalist>`;
  if(S.view==='map')drawMap();
}

/* ---------- панель деталей: быстрый ответ, остальное — во вкладках ---------- */
const DTABS=[['overview','Обзор'],['route','Как добраться'],['self','Самостоятельно'],['tours','Готовые туры'],['hotels','Отели'],['safety','Безопасность'],['docs','Документы']];
function renderDetails(){
  const el=$('#details');if(!el)return;const r=cur();
  if(!r){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;const d=r.d,ph=cardPhoto(d,1200),sp=selfPrice(r),tp=tourPrice(r);
  if(!DTABS.some(t=>t[0]===S.dtab)&&S.dtab!=='cost')S.dtab='overview';
  let body;try{body={overview:tabOverview,route:tabRoute,self:tabSelf,tours:tabTours,hotels:tabHotels,safety:tabSafety,docs:tabDocs,cost:tabCompareCost}[S.dtab](r)}
  catch(e){console.error('[Travel Expert] вкладка',S.dtab,e);body='<div class="modfail">Данные для этой вкладки временно недоступны. Остальные вкладки работают.</div>'}
  const tw=r.best&&r.best.tSafety.length?`Пересадка в стране с предупреждением МИД РК: ${[...new Set(r.best.tSafety.map(s=>WorldDB.countries[s.cc].name))].join(', ')}.`:'';
  const warn=r.saf.lv==='red'||r.saf.lv==='orange'?`<div class="dwarn ${r.saf.lv==='red'?'red':''}"><b>${SAFETY_LBL[r.saf.lv]}</b><br>${esc(r.saf.t)} <span class="muted">(${esc(r.saf.s)}, ${esc(r.saf.d)})</span></div>`:'';
  const way=(label,p,btn)=>`<div class="way"><span class="wl">${label}</span>${p.txt?`<b class="wp">${p.txt}</b><span class="muted" style="font-size:13px">на человека</span>`:`<span class="wn">${p.na}</span>`}${p.cap?`<span class="stcap">${esc(p.cap)}</span>`:''}${btn}</div>`;
  el.innerHTML=`<button class="icon-btn dclose" type="button" data-act="dclose" aria-label="Закрыть детали">✕</button>
  ${ph?`<div class="dhero" id="dhero"><img src="${esc(ph.src)}" alt="${esc(d.ru)}" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('nop');this.remove()"><span class="bigflag" aria-hidden="true">${flagOf(d.cc)}</span><a class="credit" href="${esc(ph.page)}" target="_blank" rel="noopener">© Wikimedia Commons ↗</a></div>`
      :`<div class="dhero nop"><span class="bigflag" aria-hidden="true">${flagOf(d.cc)}</span></div>`}
  <div class="dtop">
    <div>
      <div class="row" style="gap:6px 14px"><span class="cap">${flagOf(d.cc)} ${esc(d.country.name)} · ${KIND_LBL[d.kind].toLowerCase()}</span><span style="margin-left:auto;display:flex;gap:14px"><button class="quiet" type="button" data-act="save" data-v="${d.id}">${isSaved(d.id)?'★ Сохранено':'☆ Сохранить'}</button><button class="quiet" type="button" data-act="cmp" data-v="${d.id}">${S.compare.includes(d.id)?'✓ В сравнении':'+ К сравнению'}</button></span></div>
      <div class="dttl" style="margin-top:4px"><h2>${esc(d.ru)}</h2><span class="fit">${r.match}% подходит</span></div>
      <p class="desc" style="margin-top:10px">${esc(descLine(r))}</p>
    </div>
    ${warn}${tw?`<div class="dwarn">${esc(tw)}</div>`:''}${r.forced?'<p class="small muted">Открыт вне выдачи — посчитан полностью по вашему запросу.</p>':''}
    <ul class="r3">${reasonList(r).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="dsecline"><b style="font-size:16.5px">Как поехать</b>
      <div class="ways">${way('Самостоятельно',sp,`<button class="cta sm" type="button" data-act="go-self" data-v="${d.id}">Собрать поездку</button>`)}${way('Готовый тур',tp,`<button class="outl" type="button" data-act="go-tours" data-v="${d.id}">Смотреть туры</button>`)}</div>
      <button class="lnk" type="button" data-act="dtab" data-v="cost">Сравнить варианты →</button>
    </div>
  </div>
  <div class="dtabs" role="tablist" id="dtabs">${DTABS.map(([k,l])=>`<button type="button" role="tab" aria-selected="${S.dtab===k}" data-act="dtab" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="dbody">${S.dtab==='cost'?'<b style="font-size:16.5px">Сравнение: самостоятельно ↔ готовый тур</b>':''}${body}</div>`;
}
function tabOverview(r){
  const d=r.d,keys=Object.keys(r.W).filter(k=>r.W[k]),ev=getEvents(d),cm=S.results.w.indexOf(Math.max(...S.results.w));
  const shift=[-14,-7,7,14].map(k=>{const s0=S.start,e0=S.end;S.start=iso(addDays(pd(s0),k));S.end=iso(addDays(pd(e0),k));const v=calculateSeasonScore(d,SeasonEngine.weights()).score;S.start=s0;S.end=e0;return [k,Math.round(v)]});
  const bestShift=shift.reduce((a,b)=>b[1]>a[1]?b:a);
  return `<div><p class="sub">Что учесть</p><ul class="care">${r.care.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Существенных минусов не найдено</li>'}</ul></div>
  <div><p class="sub">Почему подходит — все причины</p><ul class="why">${r.why.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Направление выбрано вами</li>'}</ul></div>
  <div><p class="sub">Сезон · безопасность · въезд</p><dl class="kv"><dt>Сезон</dt><dd>${SEASON_LBL[r.se.code]}</dd><dt>Безопасность</dt><dd>${SAFETY_LBL[r.saf.lv]}</dd><dt>Въезд</dt><dd>${esc(r.entry.label)}${r.entry.stay?' · '+esc(r.entry.stay):''}</dd></dl></div>
  <div><p class="sub">${r.match}% подходит вам${r.cap<100?` · ограничено ${r.cap}% безопасностью`:''}</p><div class="bars">${keys.map(k=>`<div class="bar-row"><span>${FLBL[k]}</span><span class="bar"><i style="width:${Math.round(r.sc[k])}%"></i></span><span>${Math.round(r.sc[k])}%</span></div>`).join('')}</div>
    <p class="xs faint" style="margin-top:6px">Итог = ${keys.map(k=>`${FLBL[k].toLowerCase()} × ${Math.round(r.W[k]/r.tw*100)}%`).join(' + ')}. Безопасность не прибавляется к сумме: 🟠 ограничивает итог 70%, 🔴 переносит в «Требует внимания».</p></div>
  <div><p class="sub">Лучшие даты · климат по месяцам ${stBadge('est')}</p><div class="months">${r.se.own.map((v,m)=>`<div class="m-${SeasonEngine.code(v)} ${m===cm?'cur':''}" title="${SEASON_LBL[SeasonEngine.code(v)]}: ${Math.round(v)}%"><b>${d.air[m]}°</b>${MON_SH[m]}</div>`).join('')}</div>
    <p class="xs muted" style="margin-top:6px">${bestShift[1]>r.se.score+3?`Если сдвинуть поездку на ${bestShift[0]>0?'+':''}${bestShift[0]} дней, сезонность будет ${bestShift[1]}% вместо ${Math.round(r.se.score)}%.`:'Ваши даты — одни из лучших в ближайшие ±2 недели.'} ${d.sea?`Море в ваши даты ~${Math.round(r.se.sea)}°.`:''} Воздух днём ~${Math.round(r.se.air)}°. Климат: опорная точка в ${d.climDist} км${d.climDist>400?' (далеко — точность ниже)':''}.</p></div>
  ${S.children.length?`<div><p class="sub">Нагрузка для детей</p><dl class="kv"><dt>Дорога до отеля</dt><dd>${r.best?hm(r.best.doorAll):'—'}${r.best&&r.best.doorAll>S.maxHours?' — больше лимита':''}</dd><dt>Пересадки</dt><dd>${r.best?r.best.stops:'—'}${r.best&&r.best.lay.length?` · стыковки ${r.best.lay.map(x=>hm(x.h)).join(', ')}`:''}</dd><dt>Разница во времени</dt><dd>${r.tzDiff>0?'+':''}${r.tzDiff} ч к Астане</dd><dt>Климат</dt><dd>${Math.round(r.se.air)}° днём${r.se.air>32?' — жарко для малышей':''}</dd><dt>Транспорт</dt><dd>${esc(r.tr.text)}</dd><dt>Медицина, аптеки</dt><dd><a href="${r.tr.hospitals}" target="_blank" rel="noopener">Больницы и аптеки на карте ↗</a></dd></dl></div>`:''}
  ${ev.length?`<div><p class="sub">События в ваши даты ${stBadge('est')}</p><ul class="care">${ev.map(e=>`<li>${esc(e.n)} (${dShort(e.f)}–${dShort(e.t)})</li>`).join('')}</ul></div>`:''}`;
}
function scrollDetailsToTabs(){const el=$('#details'),t=$('#dtabs');if(!el||!t)return;if(getComputedStyle(el).position==='sticky'||getComputedStyle(el).position==='fixed')el.scrollTop=Math.max(0,t.offsetTop-6);else t.scrollIntoView({block:'start',behavior:'smooth'})}
function select(id){S.selected=id;S.dtab='overview';renderResults();renderDetails();const el=$('#details');if(el)el.scrollTop=0}
function openTab(id,tab){S.selected=id;S.dtab=tab;renderResults();renderDetails();scrollDetailsToTabs()}

/* ---------- действия интерфейса (поверх существующих) ---------- */
const onActBase=onAct;
onAct=function(a,v){
  switch(a){
    case 'fld':S.field=S.field===v?null:v;S.pick=null;renderParams();return;
    case 'fld-apply':case 'fld-close':S.field=null;S.pick=null;renderParams();run();return;
    case 'flt-toggle':S.fltOpen=!S.fltOpen;S.field=null;renderParams();return;
    case 'fsec':S.fsec=S.fsec===v?null:v;renderParams();return;
    case 'fset':{const i=v.indexOf(':'),k=v.slice(0,i),val=v.slice(i+1);if(!(k in FDEF))return;S[k]=/^-?\d+$/.test(val)?+val:val;renderParams();runSoon();return}
    case 'ftog':if(v in FDEF){S[v]=!S[v];renderParams();runSoon()}return;
    case 'fsrc':S.tourSrc[v]=!srcOn(v);renderParams();runSoon();return;
    case 'frest0':S.rest=[];renderParams();runSoon();return;
    case 'fclr':clearFilter(v);renderParams();runSoon();return;
    case 'freset':resetFilters();renderParams();runSoon();return;
    case 'noop':return;
    case 'dtab':S.dtab=v;renderDetails();scrollDetailsToTabs();return;
    case 'rest':onActBase(a,v);runSoon();return;
    case 'select':if(S.selected===v){S.selected=null;renderResults();renderDetails();return}onActBase(a,v);return;
  }
  onActBase(a,v)};
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.chg;if(!c)return;
  if(c==='sort'){try{onAct('sort',e.target.value)}catch(err){console.error(err)}}
  if(c==='budgetTotal'||c==='budgetPP'){renderParams();runSoon()}});
// клик вне всплывающего параметра закрывает его и применяет изменения
document.addEventListener('click',e=>{if(S.field&&!e.target.closest('#params')){S.field=null;S.pick=null;setTimeout(()=>{renderParams();run()},0)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.field){S.field=null;renderParams();run()}else if(S.fltOpen&&innerWidth<=1240){S.fltOpen=false;renderParams()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('res')){e.preventDefault();e.target.click()}});

/* boot */
window.addEventListener('error',e=>{busy(false);console.error('[Travel Expert]',e.error||e.message);showErr('Ошибка в одной из функций. Остальные функции доступны.')});
window.addEventListener('unhandledrejection',e=>{busy(false);console.error('[Travel Expert]',e.reason);showErr('Не удалось загрузить часть данных. Остальные функции доступны.')});
(()=>{const b=document.getElementById('errClose');if(b)b.onclick=()=>{document.getElementById('errbar').hidden=true}})();
safeRender('Шапка',initTop,null);
safeRender('Параметры',renderParams,'#params');safeRender('Сводка запроса',renderAskMeta,'#askMeta');
window.__TE_READY=true;
run({force:true});   // расчёт после первой отрисовки: страница сразу интерактивна
initAI().catch(()=>{const m=$('#aiMode');if(m)m.textContent='Упрощённый режим: запрос разбирается в браузере.'});
